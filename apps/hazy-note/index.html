<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hazy note</title>
    <meta name="description" content="URLの霧を、自分の言葉に落とすまで" />
    <link rel="icon" href="/hazy.ico" />
    <link rel="shortcut icon" href="/hazy.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("hazy-note:density") === "compact") {
          document.documentElement.classList.add("density-compact");
        }
      } catch {
        // Ignore storage access failures in private browsing.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
